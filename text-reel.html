<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f7" />
    <title>Text Reel</title>
    <link rel="stylesheet" href="text-dial.css" />
    <link rel="stylesheet" href="text-reel.css" />
    <link rel="stylesheet" href="tool-ui.css" />
  </head>
  <body class="tool-page text-reel-tool" data-tool-key="text-reel">
    <header class="dial-header tool-header">
      <a class="dial-brand tool-brand" href="./index.html" aria-label="ホームへ戻る">
        <span class="dial-brand-mark reel-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <h1>Text Reel</h1>
          <p>スロットマシン風文字リール</p>
        </div>
      </a>
    </header>

    <main class="dial-workspace reel-workspace tool-shell tool-shell-compact">
      <aside class="dial-controls tool-sidebar tool-sidebar-left" aria-label="文字リール設定">
        <section class="control-section reel-columns-section">
          <div class="section-heading">
            <h2>列ごとの設定</h2>
            <output id="columnCount">4 / 12列</output>
          </div>
          <div class="column-toolbar">
            <button id="addColumnButton" class="button button-secondary" type="button">＋ 列を追加</button>
            <button id="randomizeButton" class="button button-secondary" type="button">開始位置を更新</button>
          </div>
          <div id="columnOptions" class="reel-column-options"></div>
          <p class="field-help">全列が0秒から回転します。リール文字列（最大40文字）、方向、速度、確定文字、確定時刻、停止動作を列ごとに指定します。</p>
        </section>

        <section class="control-section tool-panel-right">
          <div class="section-heading">
            <h2>タイミング</h2>
            <output id="durationMeta" class="meta-value">12.0 秒</output>
          </div>
          <label class="field-row" for="duration">
            <span>全体時間</span>
            <output id="durationValue">12.0 秒</output>
          </label>
          <input id="duration" class="range" type="range" min="1" max="90" step="0.1" value="12" />
          <p class="field-help compact-help">最大90秒。各列の確定時刻はこの範囲内で指定できます。</p>
        </section>

        <section class="control-section design-section">
          <div class="section-heading">
            <h2>デザイン</h2>
          </div>
          <div class="field-row select-row">
            <label for="fontStyle">書体</label>
            <select id="fontStyle">
              <option value="sans" selected>ゴシック</option>
              <option value="serif">明朝</option>
              <option value="mono">等幅</option>
            </select>
          </div>
          <div class="local-font-row">
            <label class="button button-secondary" for="fontFile">フォントを選択</label>
            <input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden />
            <span id="fontFileName">端末内のフォント</span>
          </div>
          <div class="field-row color-row">
            <label for="textColor">文字</label>
            <span class="color-control"><input id="textColor" type="color" value="#172128" /><output>#172128</output></span>
          </div>
          <div class="field-row color-row">
            <label for="reelColor">リール</label>
            <span class="color-control"><input id="reelColor" type="color" value="#fffdf8" /><output>#FFFDF8</output></span>
          </div>
          <div class="field-row color-row">
            <label for="backgroundColor">背景</label>
            <span class="color-control"><input id="backgroundColor" type="color" value="#FFFFFF" /><output>#FFFFFF</output></span>
          </div>
        </section>

        <section class="control-section export-section tool-panel-right">
          <dl class="output-summary">
            <div><dt>出力</dt><dd><select id="outputSize" class="output-size-select" aria-label="出力サイズ"><option value="1600x1000" selected>1600 × 1000</option><option value="1920x900">1920 × 900</option><option value="1920x1080">1920 × 1080</option></select></dd></div><div><dt>形式</dt><dd><select id="outputFormat" class="output-size-select" aria-label="出力形式"><option value="webm" selected>WebM</option><option value="mp4">MP4</option></select></dd></div>
            <div><dt>形式</dt><dd>WebM / PNG</dd></div>
          </dl>
          <label class="field-row" for="imageTime">
            <span>画像の時刻</span>
            <output id="imageTimeValue">6.0 秒</output>
          </label>
          <input id="imageTime" class="range" type="range" min="0" max="12" step="0.1" value="6" />
          <button id="imageExportButton" class="button button-secondary export-image-button" type="button"><span aria-hidden="true">▣</span><span>PNGを書き出す</span></button>
          <button id="exportButton" class="button button-export" type="button"><span aria-hidden="true">↓</span><span id="exportButtonLabel">動画を書き出す</span></button>
          <div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div>
        </section>
      </aside>

      <section class="dial-stage-panel tool-stage" aria-label="文字リールプレビュー">
        <div class="stage-toolbar">
          <div>
            <strong>プレビュー</strong>
            <span id="stageDimensions">16:10 · 1600 × 1000</span>
          </div>
          <span id="stageStatus" class="stage-status">4列 · 4列停止 · 列別速度</span>
        </div>

        <div class="canvas-shell">
          <canvas id="reelCanvas" width="1600" height="1000" aria-label="文字回転リールアニメーションのプレビュー"></canvas>
        </div>

        <div class="transport">
          <button id="restartButton" class="icon-button" type="button" title="先頭に戻る" aria-label="先頭に戻る">↺</button>
          <button id="playButton" class="play-button" type="button" aria-label="再生">▶</button>
          <div class="timeline-block">
            <input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" />
            <div class="time-labels"><input id="currentTime" class="time-input" type="text" inputmode="decimal" aria-label="再生位置（分:秒）" value="0:00.0" /><output id="totalTime">0:12.0</output></div>
          </div>
          <label class="speed-control" for="previewSpeed"><span>速度</span>
            <select id="previewSpeed">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script>
    <script src="tool-nav.js"></script>
    <script src="motion-toolkit.js"></script>
    <script src="motion-fonts.js"></script><script src="text-reel.js"></script>
    <script src="motion-controls.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
