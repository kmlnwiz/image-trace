<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f4f6f7" /><title>Grid Pulse</title><link rel="stylesheet" href="background-tools.css" /><link rel="stylesheet" href="tool-ui.css" /></head>
  <body class="tool-page grid-pulse" data-tool-key="grid-pulse">
    <header class="app-header tool-header">
      <a class="brand-block tool-brand" href="./index.html" aria-label="ホームへ戻る"><span class="brand-mark tool-mark" aria-hidden="true">格</span><div><h1>Grid Pulse</h1><p>格子が波打つループ背景</p></div></a>
      <div class="header-actions"><button id="seedButton" class="button button-secondary" type="button">ばらつきを変える</button></div>
    </header>
    <main class="workspace tool-workspace tool-shell">
      <aside class="control-panel control-panel-left tool-sidebar tool-sidebar-left" aria-label="格子と色の設定">
        <section class="control-section">
          <div class="section-heading"><h2>格子</h2><output id="cellCount" class="meta-value">126個</output></div>
          <div class="segmented" role="group" aria-label="格子の並べ方"><button type="button" data-layout="square" class="is-active">正方</button><button type="button" data-layout="stagger">千鳥</button><button type="button" data-layout="diagonal">斜め</button></div>
          <label class="field-row" for="columns"><span>列数</span><output id="columnsValue">14</output></label><input id="columns" class="range" type="range" min="2" max="40" step="1" value="14" />
          <label class="field-row" for="rows"><span>行数</span><output id="rowsValue">9</output></label><input id="rows" class="range" type="range" min="2" max="30" step="1" value="9" />
          <label class="field-row" for="cellSize"><span>大きさ</span><output id="cellSizeValue">46%</output></label><input id="cellSize" class="range" type="range" min="4" max="140" step="1" value="46" />
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>形</h2></div>
          <div class="field-row select-row"><label for="shape">形</label><select id="shape"><option value="circle" selected>丸</option><option value="square">四角</option><option value="ring">リング</option><option value="cross">十字</option><option value="line">線</option><option value="diamond">ひし形</option></select></div>
          <div id="cornerRadiusControl"><label class="field-row" for="cornerRadius"><span>角丸</span><output id="cornerRadiusValue">0%</output></label><input id="cornerRadius" class="range" type="range" min="0" max="50" step="1" value="0" /></div>
          <div id="thicknessControl" hidden><label class="field-row" for="thickness"><span>線の太さ</span><output id="thicknessValue">18%</output></label><input id="thickness" class="range" type="range" min="4" max="50" step="1" value="18" /></div>
          <label class="field-row" for="tilt"><span>傾き</span><output id="tiltValue">0°</output></label><input id="tilt" class="range" type="range" min="0" max="360" step="1" value="0" />
          <label class="field-row" for="emboss"><span>エンボスの強さ</span><output id="embossValue">0%</output></label><input id="emboss" class="range" type="range" min="0" max="100" step="1" value="0" />
          <label class="field-row" for="embossAngle"><span>光の向き</span><output id="embossAngleValue">225°（左上）</output></label><input id="embossAngle" class="range" type="range" min="0" max="360" step="1" value="225" />
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>色</h2></div>
          <div class="field-row color-row"><label for="backgroundColor">背景色</label><span class="color-control"><input id="backgroundColor" type="color" value="#FFFFFF" /><output>#FFFFFF</output></span></div>
          <div class="field-row color-row"><label for="shapeColor">図形色</label><span class="color-control"><input id="shapeColor" type="color" value="#16354A" /><output>#16354A</output></span></div>
          <div class="field-row color-row"><label for="shapeColorAlt">変化後の色</label><span class="color-control"><input id="shapeColorAlt" type="color" value="#1A9AAE" /><output>#1A9AAE</output></span></div>
        </section>
      </aside>
      <section class="stage-panel tool-stage pattern-stage" aria-label="格子パターンのプレビュー">
        <div class="stage-toolbar"><div><strong>プレビュー</strong><span id="stageDimensions">16:10 · 1600 × 1000</span></div><span id="stageStatus" class="stage-status">14 × 9 · 直線波</span></div>
        <div class="canvas-shell"><canvas id="previewCanvas" width="1600" height="1000" aria-label="格子が波打つ背景アニメーション"></canvas></div>
        <div class="transport"><button id="restartButton" class="icon-button transport-button" type="button" aria-label="先頭に戻る">↺</button><button id="playButton" class="play-button" type="button" aria-label="再生">▶</button><div class="timeline-block"><input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" /><div class="time-labels"><input id="currentTime" class="time-input" type="text" inputmode="decimal" aria-label="再生位置（分:秒）" value="0:00.0" /><output id="totalTime">0:06.0</output></div></div><label class="speed-control" for="previewSpeed"><span>速度</span><select id="previewSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
      </section>
      <aside class="control-panel control-panel-right tool-sidebar tool-sidebar-right" aria-label="波と出力の設定">
        <section class="control-section">
          <div class="section-heading"><h2>波</h2></div>
          <div class="field-row select-row"><label for="waveMode">波の向き</label><select id="waveMode"><option value="linear" selected>直線</option><option value="radial">同心円</option><option value="spiral">渦</option><option value="random">ランダム</option><option value="uniform">一斉</option></select></div>
          <div class="field-row select-row"><label for="waveShape">波形</label><select id="waveShape"><option value="sine" selected>なめらか</option><option value="triangle">三角</option><option value="saw">のこぎり</option><option value="pulse">点滅</option></select></div>
          <label class="field-row" for="waveAngle"><span>角度</span><output id="waveAngleValue">0°</output></label><input id="waveAngle" class="range" type="range" min="0" max="360" step="1" value="0" />
          <label class="field-row" for="wavelength"><span>波長</span><output id="wavelengthValue">45%</output></label><input id="wavelength" class="range" type="range" min="5" max="300" step="1" value="45" />
          <label class="field-row" for="cycles"><span>周回数</span><output id="cyclesValue">2周</output></label><input id="cycles" class="range" type="range" min="1" max="8" step="1" value="2" />
          <label class="field-row" for="jitter"><span>位相のばらつき</span><output id="jitterValue">0%</output></label><input id="jitter" class="range" type="range" min="0" max="100" step="1" value="0" />
          <label class="field-row" for="duration"><span>全体時間</span><output id="durationValue">6.0 秒</output></label><input id="duration" class="range" type="range" min="0.5" max="90" step="0.5" value="6" />
          <p class="loop-note"><strong>ループ</strong>周回数が整数なので、末尾と先頭がつながります。</p>
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>波に連動</h2></div>
          <label class="check-row" for="linkSize"><input id="linkSize" type="checkbox" checked /><span>大きさ</span></label>
          <label class="field-row" for="sizeMin"><span>最小の大きさ</span><output id="sizeMinValue">20%</output></label><input id="sizeMin" class="range" type="range" min="0" max="100" step="1" value="20" />
          <label class="check-row" for="linkOpacity"><input id="linkOpacity" type="checkbox" /><span>不透明度</span></label>
          <label class="field-row" for="opacityMin"><span>最小の不透明度</span><output id="opacityMinValue">15%</output></label><input id="opacityMin" class="range" type="range" min="0" max="100" step="1" value="15" />
          <label class="check-row" for="linkRotation"><input id="linkRotation" type="checkbox" /><span>回転</span></label>
          <label class="field-row" for="rotationAmount"><span>回転量</span><output id="rotationAmountValue">90°</output></label><input id="rotationAmount" class="range" type="range" min="0" max="720" step="5" value="90" />
          <label class="check-row" for="linkColor"><input id="linkColor" type="checkbox" /><span>色（図形色 → 変化後の色）</span></label>
        </section>
        <section class="control-section export-section"><div class="section-heading"><h2>出力</h2><span class="format-badge">WebM・MP4 / PNG</span></div><dl class="export-summary"><div><dt>サイズ</dt><dd><select id="outputSize" class="output-size-select" aria-label="出力サイズ"><option value="800">800 × 800</option><option value="1600x900">1600 × 900</option><option value="1600x1000" selected>1600 × 1000</option><option value="1920x900">1920 × 900</option><option value="1920x1080">1920 × 1080</option></select></dd></div><div><dt>フレーム</dt><dd>60 fps</dd></div><div><dt>形式</dt><dd><select id="outputFormat" class="output-size-select" aria-label="出力形式"><option value="webm" selected>WebM</option><option value="mp4">MP4</option></select></dd></div></dl><label class="field-row" for="imageTime"><span>画像の時刻</span><output id="imageTimeValue">3.0 秒</output></label><input id="imageTime" class="range" type="range" min="0" max="6" step="0.1" value="3" /><button id="imageExportButton" class="button button-secondary button-wide export-image-button" type="button"><span aria-hidden="true">▣</span>PNGを書き出す</button><button id="exportButton" class="button button-export button-wide" type="button"><span aria-hidden="true">↓</span>動画を書き出す</button><div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div></section>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script>
    <script src="tool-nav.js"></script><script src="motion-toolkit.js"></script><script src="motion-pattern.js"></script><script src="grid-pulse.js"></script><script src="motion-controls.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
