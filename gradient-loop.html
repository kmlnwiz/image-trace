<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f4f6f7" /><title>Gradient Loop</title><link rel="stylesheet" href="background-tools.css" /><link rel="stylesheet" href="tool-ui.css" /></head>
  <body class="tool-page gradient-loop" data-tool-key="gradient-loop">
    <header class="app-header tool-header">
      <a class="brand-block tool-brand" href="./index.html" aria-label="ホームへ戻る"><span class="brand-mark tool-mark" aria-hidden="true">層</span><div><h1>Gradient Loop</h1><p>色が漂うグラデーション背景</p></div></a>
      <div class="header-actions"><button id="seedButton" class="button button-secondary" type="button">配置を変える</button></div>
    </header>
    <main class="workspace tool-workspace tool-shell">
      <aside class="control-panel control-panel-left tool-sidebar tool-sidebar-left" aria-label="色の設定">
        <section class="control-section">
          <div class="section-heading"><h2>色だまり</h2><output id="blobSummary" class="meta-value">5個</output></div>
          <label class="field-row" for="blobCount"><span>数</span><output id="blobCountValue">5</output></label><input id="blobCount" class="range" type="range" min="1" max="12" step="1" value="5" />
          <label class="field-row" for="blobSize"><span>大きさ</span><output id="blobSizeValue">72%</output></label><input id="blobSize" class="range" type="range" min="10" max="200" step="1" value="72" />
          <label class="field-row" for="softness"><span>ぼかし</span><output id="softnessValue">70%</output></label><input id="softness" class="range" type="range" min="0" max="100" step="1" value="70" />
          <label class="field-row" for="density"><span>濃さ</span><output id="densityValue">90%</output></label><input id="density" class="range" type="range" min="5" max="100" step="1" value="90" />
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>色</h2></div>
          <div class="field-row select-row"><label for="colorCount">色数</label><select id="colorCount"><option value="2">2色</option><option value="3" selected>3色</option><option value="4">4色</option><option value="5">5色</option></select></div>
          <div class="palette-grid">
            <span class="color-control"><input id="color1" type="color" value="#F5C77E" /><output>#F5C77E</output></span>
            <span class="color-control"><input id="color2" type="color" value="#E8657F" /><output>#E8657F</output></span>
            <span class="color-control"><input id="color3" type="color" value="#6D4BB8" /><output>#6D4BB8</output></span>
            <span class="color-control"><input id="color4" type="color" value="#1A9AAE" /><output>#1A9AAE</output></span>
            <span class="color-control"><input id="color5" type="color" value="#16354A" /><output>#16354A</output></span>
          </div>
          <div class="field-row color-row"><label for="backgroundColor">背景色</label><span class="color-control"><input id="backgroundColor" type="color" value="#FFFFFF" /><output>#FFFFFF</output></span></div>
          <div class="field-row select-row"><label for="blend">混色</label><select id="blend"><option value="source-over" selected>通常</option><option value="multiply">乗算</option><option value="screen">スクリーン</option><option value="lighter">加算</option></select></div>
        </section>
      </aside>
      <section class="stage-panel tool-stage pattern-stage" aria-label="グラデーション背景のプレビュー">
        <div class="stage-toolbar"><div><strong>プレビュー</strong><span id="stageDimensions">16:10 · 1600 × 1000</span></div><span id="stageStatus" class="stage-status">5個 · 円軌道</span></div>
        <div class="canvas-shell"><canvas id="previewCanvas" width="1600" height="1000" aria-label="色が漂うグラデーション背景アニメーション"></canvas></div>
        <div class="transport"><button id="restartButton" class="icon-button transport-button" type="button" aria-label="先頭に戻る">↺</button><button id="playButton" class="play-button" type="button" aria-label="再生">▶</button><div class="timeline-block"><input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" /><div class="time-labels"><input id="currentTime" class="time-input" type="text" inputmode="decimal" aria-label="再生位置（分:秒）" value="0:00.0" /><output id="totalTime">0:08.0</output></div></div><label class="speed-control" for="previewSpeed"><span>速度</span><select id="previewSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
      </section>
      <aside class="control-panel control-panel-right tool-sidebar tool-sidebar-right" aria-label="動きと出力の設定">
        <section class="control-section">
          <div class="section-heading"><h2>動き</h2></div>
          <div class="field-row select-row"><label for="orbit">軌道</label><select id="orbit"><option value="circle" selected>円</option><option value="figure8">8の字</option><option value="vertical">上下</option><option value="horizontal">左右</option></select></div>
          <label class="field-row" for="spread"><span>移動の広さ</span><output id="spreadValue">55%</output></label><input id="spread" class="range" type="range" min="0" max="100" step="1" value="55" />
          <label class="field-row" for="cycles"><span>周回数</span><output id="cyclesValue">1周</output></label><input id="cycles" class="range" type="range" min="1" max="6" step="1" value="1" />
          <label class="field-row" for="jitter"><span>配置のばらつき</span><output id="jitterValue">70%</output></label><input id="jitter" class="range" type="range" min="0" max="100" step="1" value="70" />
          <label class="field-row" for="grain"><span>粒状ノイズ</span><output id="grainValue">8%</output></label><input id="grain" class="range" type="range" min="0" max="60" step="1" value="8" />
          <label class="field-row" for="duration"><span>全体時間</span><output id="durationValue">8.0 秒</output></label><input id="duration" class="range" type="range" min="0.5" max="90" step="0.5" value="8" />
          <p class="loop-note"><strong>ループ</strong>色だまりが軌道をちょうど周回して戻るので、末尾と先頭がつながります。</p>
        </section>
        <section class="control-section export-section"><div class="section-heading"><h2>出力</h2><span class="format-badge">WebM / PNG</span></div><dl class="export-summary"><div><dt>サイズ</dt><dd><select id="outputSize" class="output-size-select" aria-label="出力サイズ"><option value="800">800 × 800</option><option value="1600x900">1600 × 900</option><option value="1600x1000" selected>1600 × 1000</option><option value="1920x900">1920 × 900</option></select></dd></div><div><dt>フレーム</dt><dd>60 fps</dd></div></dl><label class="field-row" for="imageTime"><span>画像の時刻</span><output id="imageTimeValue">4.0 秒</output></label><input id="imageTime" class="range" type="range" min="0" max="8" step="0.1" value="4" /><button id="imageExportButton" class="button button-secondary button-wide export-image-button" type="button"><span aria-hidden="true">▣</span>PNGを書き出す</button><button id="exportButton" class="button button-export button-wide" type="button"><span aria-hidden="true">↓</span>動画を書き出す</button><div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div></section>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script>
    <script src="tool-nav.js"></script><script src="motion-toolkit.js"></script><script src="motion-pattern.js"></script><script src="gradient-loop.js"></script><script src="motion-controls.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
