<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f4f6f7" /><title>Slice Motion</title><link rel="stylesheet" href="studio-tools.css" /><link rel="stylesheet" href="tool-ui.css" /></head>
  <body class="tool-page slice-motion" data-tool-key="slice-motion">
    <header class="app-header tool-header">
      <a class="brand-block tool-brand" href="./index.html" aria-label="ホームへ戻る"><span class="brand-mark tool-mark" aria-hidden="true">切</span><div><h1>Slice Motion</h1><p>画像を分割して組み上げる</p></div></a>
      <div class="header-actions"><button id="sampleButton" class="button button-secondary" type="button">サンプル</button><label class="button button-primary" for="fileInput"><span aria-hidden="true">↑</span>画像を開く</label><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden /></div>
    </header>
    <main class="workspace tool-workspace tool-shell">
      <aside class="control-panel control-panel-left tool-sidebar tool-sidebar-left" aria-label="画像と分割の設定">
        <section class="control-section">
          <div class="section-heading"><h2>画像</h2><span id="imageDimensions" class="meta-value">—</span></div>
          <div id="fileSummary" class="file-summary compact"><div class="file-thumbnail"><span>IMG</span></div><div class="file-copy"><strong id="fileName">サンプル</strong><span id="fileMeta">内蔵サンプル</span></div></div>
          <div class="field-row select-row"><label for="imageFit">配置</label><select id="imageFit"><option value="cover" selected>全面に合わせる</option><option value="contain">全体を入れる</option></select></div>
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>分割</h2><output id="pieceCount" class="meta-value">12枚</output></div>
          <div class="segmented" role="group" aria-label="分割方向"><button type="button" data-layout="vertical" class="is-active">縦</button><button type="button" data-layout="horizontal">横</button><button type="button" data-layout="grid">グリッド</button></div>
          <label class="field-row" for="columns"><span id="columnsLabel">分割数</span><output id="columnsValue">12</output></label><input id="columns" class="range" type="range" min="2" max="30" step="1" value="12" />
          <div id="rowsControl"><label class="field-row" for="rows"><span>行数</span><output id="rowsValue">5</output></label><input id="rows" class="range" type="range" min="2" max="18" step="1" value="5" /></div>
          <label class="field-row" for="gap"><span>すき間</span><output id="gapValue">0 px</output></label><input id="gap" class="range" type="range" min="0" max="32" step="1" value="0" />
        </section>
        <section class="control-section"><div class="section-heading"><h2>背景</h2></div><div class="field-row color-row"><label for="backgroundColor">背景色</label><span class="color-control"><input id="backgroundColor" type="color" value="#101b24" /><output>#101B24</output></span></div><label class="check-row" for="fade"><input id="fade" type="checkbox" checked /><span>移動中にフェードイン</span></label></section>
      </aside>
      <section class="stage-panel tool-stage" aria-label="スライスアニメーションプレビュー">
        <div class="stage-toolbar"><div><strong>プレビュー</strong><span>16:10 · 1600 × 1000</span></div><span id="stageStatus" class="stage-status">12枚 · 縦分割</span></div>
        <div class="canvas-shell"><canvas id="previewCanvas" width="1600" height="1000" aria-label="分割した画像が組み上がるアニメーション"></canvas><div id="canvasMessage" class="canvas-message" hidden></div></div>
        <div class="transport"><button id="restartButton" class="icon-button transport-button" type="button" aria-label="先頭に戻る">↺</button><button id="playButton" class="play-button" type="button" aria-label="再生">▶</button><div class="timeline-block"><input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" /><div class="time-labels"><output id="currentTime">0:00.0</output><output id="totalTime">0:05.0</output></div></div><label class="speed-control" for="previewSpeed"><span>速度</span><select id="previewSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
      </section>
      <aside class="control-panel control-panel-right tool-sidebar tool-sidebar-right" aria-label="動きと出力の設定">
        <section class="control-section"><div class="section-heading"><h2>動き</h2></div>
          <div class="field-row select-row"><label for="direction">移動方向</label><select id="direction"><option value="alternate" selected>交互</option><option value="random">ランダム</option><option value="positive">正方向</option><option value="negative">逆方向</option><option value="center">中心から外側</option></select></div>
          <div class="field-row select-row"><label for="order">確定順</label><select id="order"><option value="sequence">順番</option><option value="center">中央から</option><option value="edges">両端から</option><option value="random" selected>ランダム</option><option value="simultaneous">同時</option></select></div>
          <label class="field-row" for="distance"><span>移動距離</span><output id="distanceValue">75%</output></label><input id="distance" class="range" type="range" min="10" max="140" step="1" value="75" />
          <label class="field-row" for="stagger"><span>確定の時間差</span><output id="staggerValue">64%</output></label><input id="stagger" class="range" type="range" min="0" max="90" step="1" value="64" />
          <label class="field-row" for="duration"><span>全体時間</span><output id="durationValue">5.0 秒</output></label><input id="duration" class="range" type="range" min="0.5" max="90" step="0.5" value="5" />
          <div class="field-row select-row"><label for="easing">動き</label><select id="easing"><option value="easeInOut" selected>なめらか</option><option value="easeOut">減速</option><option value="backOut">少し弾む</option><option value="linear">一定</option></select></div>
          <button id="shuffleButton" class="button button-accent" type="button"><span aria-hidden="true">↝</span>順番をシャッフル</button>
        </section>
        <section class="control-section export-section"><div class="section-heading"><h2>出力</h2><span class="format-badge">WebM / PNG</span></div><dl class="export-summary"><div><dt>サイズ</dt><dd>1600 × 1000</dd></div><div><dt>フレーム</dt><dd>60 fps</dd></div></dl><label class="field-row" for="imageTime"><span>画像の時刻</span><output id="imageTimeValue">2.5 秒</output></label><input id="imageTime" class="range" type="range" min="0" max="5" step="0.1" value="2.5" /><button id="imageExportButton" class="button button-secondary button-wide export-image-button" type="button"><span aria-hidden="true">▣</span>PNGを書き出す</button><button id="exportButton" class="button button-export button-wide" type="button"><span aria-hidden="true">↓</span>動画を書き出す</button><div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div></section>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script><script src="motion-toolkit.js"></script><script src="slice-motion.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
