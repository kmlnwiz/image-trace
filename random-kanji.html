<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f7" />
    <title>Random Kanji</title>
    <link rel="stylesheet" href="random-kanji.css" />
    <link rel="stylesheet" href="tool-ui.css" />
  </head>
  <body class="tool-page random-kanji-tool" data-tool-key="random-kanji">
    <header class="kanji-header tool-header">
      <a class="kanji-brand tool-brand" href="./index.html" aria-label="ホームへ戻る">
        <span class="kanji-brand-mark random-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <h1>Random Kanji</h1>
          <p>ランダム画アニメーション</p>
        </div>
      </a>
    </header>

    <main class="kanji-workspace tool-shell tool-shell-compact">
      <aside class="kanji-controls tool-sidebar tool-sidebar-left" aria-label="ランダム画設定">
        <section class="control-section">
          <div class="section-heading">
            <h2>漢字</h2>
            <output>1文字</output>
          </div>
          <input id="characterInput" class="character-input" type="text" value="舞" maxlength="2" autocomplete="off" spellcheck="false" aria-describedby="characterHint" />
          <p id="characterHint" class="field-hint">日本式の書き順データがある漢字に対応します。</p>
          <div id="dataStatus" class="data-status" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span>画データを読み込み中</span>
          </div>
        </section>

        <section class="control-section tool-panel-right">
          <div class="section-heading">
            <h2>ランダム表示</h2>
            <output id="strokeCount">— 画</output>
          </div>
          <div class="direction-summary random-summary" aria-label="アニメーション概要">
            <div><span>画の順序</span><strong>巡回ごとにランダム</strong></div>
            <div><span>巡回</span><strong id="durationSummary">— 巡</strong></div>
          </div>

          <label class="field-row" for="duration">
            <span>全体時間</span>
            <output id="durationValue">10.0 秒</output>
          </label>
          <input id="duration" class="range" type="range" min="1" max="90" step="0.5" value="10" />

          <label class="field-row" for="strokesPerStep">
            <span>1回に表示</span>
            <output id="strokesPerStepValue">1 画</output>
          </label>
          <input id="strokesPerStep" class="range" type="range" min="1" max="64" step="1" value="1" />

          <label class="field-row" for="stepInterval">
            <span>切り替え間隔</span>
            <output id="stepIntervalValue">1.0 秒</output>
          </label>
          <input id="stepInterval" class="range" type="range" min="0.1" max="60" step="0.1" value="1" />
          <p class="field-hint timing-hint">全体時間内で巡回し、2巡目以降も順番と組み合わせを再抽選します。</p>

          <div class="field-row select-row">
            <label for="displayMode">表示の重ね方</label>
            <select id="displayMode">
              <option value="cumulative" selected>積み上げる</option>
              <option value="replace">入れ替える</option>
            </select>
          </div>
          <div class="field-row select-row">
            <label for="revealStyle">切り替え方</label>
            <select id="revealStyle">
              <option value="fade" selected>フェード</option>
              <option value="instant">瞬時</option>
            </select>
          </div>

          <button id="shuffleButton" class="button button-secondary shuffle-button" type="button"><span aria-hidden="true">↝</span>順番をシャッフル</button>
          <label class="check-row" for="autoShuffle">
            <input id="autoShuffle" type="checkbox" checked />
            <span>完了後の再生で全巡を再シャッフル</span>
          </label>

          <div class="sequence-block">
            <span>表示順</span>
            <div id="sequencePreview" class="sequence-preview" aria-label="ランダムな表示順"></div>
          </div>
        </section>

        <section class="control-section">
          <div class="section-heading"><h2>見た目</h2></div>
          <label class="field-row" for="guideOpacity">
            <span>全体の下書き</span>
            <output id="guideOpacityValue">6%</output>
          </label>
          <input id="guideOpacity" class="range" type="range" min="0" max="40" step="1" value="6" />
          <div class="field-row color-row">
            <label for="inkColor">文字</label>
            <span class="color-control"><input id="inkColor" type="color" value="#173f4a" /><output>#173F4A</output></span>
          </div>
          <div class="field-row color-row">
            <label for="backgroundColor">背景</label>
            <span class="color-control"><input id="backgroundColor" type="color" value="#FFFFFF" /><output>#FFFFFF</output></span>
          </div>
        </section>

        <section class="control-section export-section tool-panel-right">
          <dl class="output-summary">
            <div><dt>出力</dt><dd><select id="outputSize" class="output-size-select" aria-label="出力サイズ"><option value="800" selected>800 × 800</option><option value="400">400 × 400</option><option value="1920x900">1920 × 900</option><option value="1920x1080">1920 × 1080</option></select></dd></div><div><dt>形式</dt><dd><select id="outputFormat" class="output-size-select" aria-label="出力形式"><option value="mp4" selected>MP4</option><option value="webm">WebM</option></select></dd></div>
            <div><dt>形式</dt><dd>WebM / PNG</dd></div>
          </dl>
          <label class="field-row" for="imageTime">
            <span>画像の時刻</span>
            <output id="imageTimeValue">1.0 秒</output>
          </label>
          <input id="imageTime" class="range" type="range" min="0" max="60" step="0.1" value="1" />
          <button id="imageExportButton" class="button button-secondary export-image-button" type="button"><span aria-hidden="true">▣</span>PNGを書き出す</button>
          <button id="exportButton" class="button button-export" type="button"><span aria-hidden="true">↓</span>動画を書き出す</button>
          <div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div>
          <p class="data-credit">画データ: <a href="https://github.com/chanind/hanzi-writer-data-jp" target="_blank" rel="noreferrer">Hanzi Writer Japanese Data</a><br />AnimCJK / Arphic Public License・LGPL</p>
        </section>
      </aside>

      <section class="kanji-stage-panel tool-stage" aria-label="ランダム画プレビュー">
        <div class="stage-toolbar">
          <div>
            <strong>プレビュー</strong>
            <span id="stageDimensions">1:1 · 800 × 800</span>
          </div>
          <span id="stageStatus" class="stage-status">読み込み中</span>
        </div>

        <div class="canvas-shell">
          <canvas id="kanjiCanvas" width="800" height="800" aria-label="漢字の画をランダムに表示するアニメーションのプレビュー"></canvas>
          <div id="canvasMessage" class="canvas-message" hidden></div>
        </div>

        <div class="transport">
          <button id="restartButton" class="icon-button" type="button" title="先頭に戻る" aria-label="先頭に戻る">↺</button>
          <button id="playButton" class="play-button" type="button" aria-label="再生">▶</button>
          <div class="timeline-block">
            <input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" />
            <div class="time-labels"><input id="currentTime" class="time-input" type="text" inputmode="decimal" aria-label="再生位置（分:秒）" value="0:00.0" /><output id="totalTime">0:00.0</output></div>
          </div>
          <label class="speed-control" for="previewSpeed"><span>速度</span>
            <select id="previewSpeed">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script>
    <script src="tool-nav.js"></script>
    <script src="motion-toolkit.js"></script>
    <script src="random-kanji.js"></script>
    <script src="motion-controls.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
