<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f4f6f7" /><title>Color Grid</title><link rel="stylesheet" href="background-tools.css" /><link rel="stylesheet" href="tool-ui.css" /></head>
  <body class="tool-page color-grid" data-tool-key="color-grid">
    <header class="app-header tool-header">
      <a class="brand-block tool-brand" href="./index.html" aria-label="ホームへ戻る"><span class="brand-mark tool-mark" aria-hidden="true">彩</span><div><h1>Color Grid</h1><p>格子の色が周期的に変わる</p></div></a>
      <div class="header-actions"><button id="seedButton" class="button button-secondary" type="button">ばらつきを変える</button></div>
    </header>
    <main class="workspace tool-workspace tool-shell">
      <aside class="control-panel control-panel-left tool-sidebar tool-sidebar-left" aria-label="格子と色の設定">
        <section class="control-section">
          <div class="section-heading"><h2>格子</h2><output id="cellCount" class="meta-value">40個</output></div>
          <label class="field-row" for="columns"><span>列数</span><output id="columnsValue">8</output></label><input id="columns" class="range" type="range" min="1" max="40" step="1" value="8" />
          <label class="field-row" for="rows"><span>行数</span><output id="rowsValue">5</output></label><input id="rows" class="range" type="range" min="1" max="30" step="1" value="5" />
          <div class="field-row select-row"><label for="shape">形</label><select id="shape"><option value="square" selected>四角</option><option value="circle">丸</option><option value="diamond">ひし形</option></select></div>
          <label class="field-row" for="gap"><span>すき間</span><output id="gapValue">0 px</output></label><input id="gap" class="range" type="range" min="0" max="60" step="1" value="0" />
          <label class="field-row" for="cornerRadius"><span>角丸</span><output id="cornerRadiusValue">0%</output></label><input id="cornerRadius" class="range" type="range" min="0" max="50" step="1" value="0" />
          <label class="field-row" for="emboss"><span>エンボスの強さ</span><output id="embossValue">0%</output></label><input id="emboss" class="range" type="range" min="0" max="100" step="1" value="0" />
          <label class="field-row" for="embossAngle"><span>光の向き</span><output id="embossAngleValue">225°（左上）</output></label><input id="embossAngle" class="range" type="range" min="0" max="360" step="1" value="225" />
        </section>
        <section class="control-section">
          <div class="section-heading"><h2>色</h2></div>
          <div class="field-row select-row"><label for="colorCount">色数</label><select id="colorCount"><option value="2">2色</option><option value="3">3色</option><option value="4" selected>4色</option><option value="5">5色</option><option value="6">6色</option></select></div>
          <div class="palette-grid">
            <span class="color-control"><input id="color1" type="color" value="#16354A" /><output>#16354A</output></span>
            <span class="color-control"><input id="color2" type="color" value="#1A9AAE" /><output>#1A9AAE</output></span>
            <span class="color-control"><input id="color3" type="color" value="#F0B14E" /><output>#F0B14E</output></span>
            <span class="color-control"><input id="color4" type="color" value="#E0041D" /><output>#E0041D</output></span>
            <span class="color-control"><input id="color5" type="color" value="#6D4BB8" /><output>#6D4BB8</output></span>
            <span class="color-control"><input id="color6" type="color" value="#F2EDE3" /><output>#F2EDE3</output></span>
          </div>
          <div class="field-row color-row"><label for="backgroundColor">背景色</label><span class="color-control"><input id="backgroundColor" type="color" value="#FFFFFF" /><output>#FFFFFF</output></span></div>
        </section>
      </aside>
      <section class="stage-panel tool-stage pattern-stage" aria-label="色格子のプレビュー">
        <div class="stage-toolbar"><div><strong>プレビュー</strong><span id="stageDimensions">16:10 · 1600 × 1000</span></div><span id="stageStatus" class="stage-status">8 × 5 · 4色</span></div>
        <div class="canvas-shell"><canvas id="previewCanvas" width="1600" height="1000" aria-label="格子の色が周期的に変わる背景アニメーション"></canvas></div>
        <div class="transport"><button id="restartButton" class="icon-button transport-button" type="button" aria-label="先頭に戻る">↺</button><button id="playButton" class="play-button" type="button" aria-label="再生">▶</button><div class="timeline-block"><input id="timeline" class="range timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" /><div class="time-labels"><input id="currentTime" class="time-input" type="text" inputmode="decimal" aria-label="再生位置（分:秒）" value="0:00.0" /><output id="totalTime">0:06.0</output></div></div><label class="speed-control" for="previewSpeed"><span>速度</span><select id="previewSpeed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div>
      </section>
      <aside class="control-panel control-panel-right tool-sidebar tool-sidebar-right" aria-label="変化と出力の設定">
        <section class="control-section">
          <div class="section-heading"><h2>変化</h2></div>
          <div class="field-row select-row"><label for="orderMode">進む向き</label><select id="orderMode"><option value="linear" selected>直線</option><option value="radial">同心円</option><option value="spiral">渦</option><option value="random">ランダム</option><option value="uniform">一斉</option></select></div>
          <div class="field-row select-row"><label for="blend">切り替え</label><select id="blend"><option value="smooth" selected>なめらか</option><option value="step">段階</option></select></div>
          <label class="field-row" for="angle"><span>角度</span><output id="angleValue">45°</output></label><input id="angle" class="range" type="range" min="0" max="360" step="1" value="45" />
          <label class="field-row" for="spread"><span>位置によるずれ</span><output id="spreadValue">100%</output></label><input id="spread" class="range" type="range" min="0" max="400" step="5" value="100" />
          <label class="field-row" for="cycles"><span>周回数</span><output id="cyclesValue">1周</output></label><input id="cycles" class="range" type="range" min="1" max="8" step="1" value="1" />
          <label class="field-row" for="duration"><span>全体時間</span><output id="durationValue">6.0 秒</output></label><input id="duration" class="range" type="range" min="0.5" max="90" step="0.5" value="6" />
          <p class="loop-note"><strong>ループ</strong>色は一巡して先頭の色へ戻るので、末尾と先頭がつながります。</p>
        </section>
        <section class="control-section export-section"><div class="section-heading"><h2>出力</h2><span class="format-badge">MP4・WebM / PNG</span></div><dl class="export-summary"><div><dt>サイズ</dt><dd><select id="outputSize" class="output-size-select" aria-label="出力サイズ"><option value="800">800 × 800</option><option value="1600x900">1600 × 900</option><option value="1600x1000" selected>1600 × 1000</option><option value="1920x900">1920 × 900</option><option value="1920x1080">1920 × 1080</option></select></dd></div><div><dt>フレーム</dt><dd>60 fps</dd></div><div><dt>形式</dt><dd><select id="outputFormat" class="output-size-select" aria-label="出力形式"><option value="mp4" selected>MP4</option><option value="webm">WebM</option></select></dd></div></dl><label class="field-row" for="imageTime"><span>画像の時刻</span><output id="imageTimeValue">3.0 秒</output></label><input id="imageTime" class="range" type="range" min="0" max="6" step="0.1" value="3" /><button id="imageExportButton" class="button button-secondary button-wide export-image-button" type="button"><span aria-hidden="true">▣</span>PNGを書き出す</button><button id="exportButton" class="button button-export button-wide" type="button"><span aria-hidden="true">↓</span>動画を書き出す</button><div id="exportProgress" class="export-progress" hidden><div id="exportProgressBar"></div></div></section>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="motion-storage.js"></script>
    <script src="tool-nav.js"></script><script src="motion-toolkit.js"></script><script src="motion-pattern.js"></script><script src="color-grid.js"></script><script src="motion-controls.js"></script><script src="tool-ui.js"></script>
  </body>
</html>
